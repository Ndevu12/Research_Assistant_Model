name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIPENV_VENV_IN_PROJECT: "1"
  PIPENV_DONT_LOAD_ENV: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests setups

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Every supported interpreter reports independently, so one broken
      # version never masks the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pipenv
        uses: ./.github/actions/setup-pipenv
        with:
          python-version: ${{ matrix.python-version }}

      # Auto-discovers every test file so new tests can never be silently skipped.
      - name: Run tests
        run: pipenv run pytest tests/ -m "not slow" --tb=short -q

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()

    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
